
media:
  input: public/images
  output: /images

content:
  - name: journal
    label: Conservation Journal
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, category]
    fields:
      - name: title
        label: Article Title
        type: string
        required: true
      - name: date
        label: Publication Date
        type: date
        required: true
      - name: category
        label: Category
        type: select
        options:
          - name: conservation
            label: Conservation
          - name: water
            label: Water
          - name: community
            label: Community
      - name: description
        label: Short Description
        type: text
      - name: body
        label: Article Content
        type: rich-text
